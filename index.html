<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="フォトフレンズ 販売記録">
<meta name="theme-color" content="#ffffff">
<title>フォトフレンズ 販売記録</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<!-- ログイン -->
<section id="login" class="login" hidden>
  <div class="login-box">
    <h1>フォトフレンズ<br>販売記録</h1>
    <div id="step1" class="login-box">
      <div class="seg">
        <button data-m="join" class="on">始める</button>
        <button data-m="new">新しく始める</button>
      </div>
      <label>合言葉
        <input id="pass" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <span id="passHint" class="small">部で決めた合言葉を入力してください</span>
      </label>
      <label>この端末の名前
        <input id="devname" type="text" placeholder="例：1号機" maxlength="12">
      </label>
      <button id="loginBtn" class="btn primary">始める</button>
    </div>
    <div id="step2" class="login-box" hidden>
      <h2 class="step-h">釣り銭準備金を入力</h2>
      <p class="small">開始時にお金を入れる箱の中身を、種類ごとの枚数で入力してください。</p>
      <div id="loginFloat" class="cash"></div>
      <div class="row"><span>合計</span><b id="loginFloatTotal">¥0</b></div>
      <button id="createBtn" class="btn primary" disabled>開始する</button>
      <button id="backBtn1" class="btn ghost">戻る</button>
    </div>
    <p id="loginMsg" class="msg"></p>
  </div>
</section>

<!-- 本体 -->
<div id="app" hidden>
  <header class="top">
    <div class="title">フォトフレンズ 販売記録</div>
    <div id="sync" class="sync"><span class="dot"></span><span id="syncText">接続中</span></div>
  </header>

  <!-- 会計 -->
  <main id="v-reg" class="view">
    <div id="closedPanel" class="closedp" hidden>
      <h2>締め済み</h2>
      <p id="closedAt" class="small"></p>
      <div class="lbl">開始時の釣り銭準備金（枚数）</div>
      <div id="openCash" class="cash"></div>
      <div class="row"><span>釣り銭準備金</span><b id="openTotal">¥0</b></div>
      <button id="openBtn" class="btn primary big">開ける</button>
    </div>
    <div id="grid" class="grid"></div>
    <div class="cartbar">
      <button id="clearBtn" class="btn ghost">クリア</button>
      <div class="cartsum"><span id="cartCount">0点</span><b id="cartTotal">¥0</b></div>
      <button id="payBtn" class="btn primary" disabled>お会計</button>
    </div>
  </main>

  <!-- 履歴 -->
  <main id="v-hist" class="view" hidden>
    <div class="histbar">
      <div id="histNormal" class="selrow"><button id="selStart" class="btn">選択して削除</button><button id="delsBtn" class="btn ghost">削除履歴</button></div>
      <div id="histSel" hidden>
        <div class="selrow">
          <span id="selCount">0件選択中</span>
          <button id="selCancel" class="btn ghost">キャンセル</button>
          <button id="selDel" class="btn danger" disabled>削除</button>
        </div>
        <div id="delPwRow" class="selrow" hidden>
          <input id="delPw" type="password" inputmode="numeric" autocomplete="off" placeholder="削除パスワード">
          <button id="delGo" class="btn danger">削除する</button>
        </div>
      </div>
      <p id="histMsg" class="small"></p>
    </div>
    <div id="restoreRow" class="selrow" hidden style="padding:8px 12px 0">
      <input id="restorePw" type="password" inputmode="numeric" autocomplete="off" placeholder="削除パスワード">
      <button id="restoreGo" class="btn danger">復元する</button>
    </div>
    <div id="delsList" class="list" hidden></div>
    <div id="hist" class="list"></div>
  </main>

  <!-- 集計 -->
  <main id="v-sum" class="view" hidden>
    <div id="sum"></div>
  </main>

  <nav class="tabs">
    <button data-v="reg" class="on">会計</button>
    <button data-v="hist">履歴</button>
    <button data-v="sum">集計</button>
  </nav>
</div>

<!-- お会計シート -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-body">
    <div class="sheet-head">
      <button id="backBtn" class="btn ghost">戻る</button>
      <span>お会計</span>
      <span></span>
    </div>
    <div id="lines" class="lines"></div>
    <div class="amt"><span>請求金額</span><b id="billAmt">¥0</b></div>
    <div class="amt paid"><span>お預かり</span><b id="paidAmt">¥0</b></div>
    <div class="amt change"><span id="changeLabel">お釣り</span><b id="changeAmt">—</b></div>
    <div class="quick">
      <button data-q="exact">ちょうど</button>
      <button data-q="1000">¥1,000</button>
      <button data-q="2000">¥2,000</button>
      <button data-q="5000">¥5,000</button>
      <button data-q="10000">¥10,000</button>
    </div>
    <div class="keys">
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="C" class="fn">C</button><button data-k="0">0</button><button data-k="00">00</button>
    </div>
    <button id="okBtn" class="btn primary big" disabled>会計を確定</button>
  </div>
</div>

<!-- 完了表示 -->
<div id="done" class="done" hidden>
  <div class="done-box">
    <div class="done-label">お釣り</div>
    <div id="doneChange" class="done-amt">¥0</div>
    <div id="doneSub" class="done-sub"></div>
    <button id="nextBtn" class="btn primary big">次のお客様</button>
  </div>
</div>

<script type="module" src="app.js?v=7"></script>
</body>
</html>
