<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>フォトフレンズ 管理</title>
<link rel="stylesheet" href="style.css?v=29">
</head>
<body>

<section id="login" class="login" hidden>
  <div class="login-box">
    <h1>フォトフレンズ<br>管理</h1>
    <label>User ID
      <input id="uid" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <label>パスワード
      <input id="pw" type="password" autocomplete="current-password">
    </label>
    <button id="loginBtn" class="btn primary">ログイン</button>
    <p id="loginMsg" class="msg"></p>
    <a class="adminlink" href="./">販売記録へ戻る</a>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="title">フォトフレンズ 管理</div>
    <button id="logoutBtn" class="btn ghost" style="padding:6px 10px">ログアウト</button>
  </header>
  <main id="v-req" class="view">
    <div class="list" id="reqList"></div>
  </main>
  <main id="v-shops" class="view" hidden>
    <div class="adm-bar"><button id="newSession" class="btn primary">＋ 新しいセッションを作る</button></div>
    <div class="list" id="shopList"></div>
  </main>
  <main id="v-prods" class="view" hidden>
    <div class="adm-grid" id="prodGrid"></div>
    <div class="adm-bar" style="padding-bottom:12px"><button id="showArch" class="btn ghost">削除した商品を表示</button></div>
  </main>
  <nav class="tabs">
    <button data-v="req" class="on">削除リクエスト</button>
    <button data-v="shops">セッション</button>
    <button data-v="prods">商品</button>
  </nav>
</div>

<!-- 下から出るシート（商品の編集・セッションの作成） -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script type="module" src="admin.js?v=29"></script>
</body>
</html>
