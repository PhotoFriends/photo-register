<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>フォトフレンズ 管理</title>
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>

<section id="login" class="login" hidden>
  <div class="login-box">
    <h1>フォトフレンズ<br>管理</h1>
    <label>User ID
      <input id="uid" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <label>パスワード
      <input id="pw" type="password" autocomplete="current-password">
    </label>
    <button id="loginBtn" class="btn primary">ログイン</button>
    <p id="loginMsg" class="msg"></p>
    <a class="adminlink" href="./">販売記録へ戻る</a>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="title">フォトフレンズ 管理</div>
    <button id="logoutBtn" class="btn ghost" style="padding:6px 10px">ログアウト</button>
  </header>
  <main id="v-req" class="view">
    <div class="list" id="reqList"></div>
  </main>
  <main id="v-shops" class="view" hidden>
    <div class="list" id="shopList"></div>
  </main>
  <nav class="tabs" style="grid-template-columns: 1fr 1fr">
    <button data-v="req" class="on">削除リクエスト</button>
    <button data-v="shops">セッション一覧</button>
  </nav>
</div>

<script type="module" src="admin.js?v=16"></script>
</body>
</html>
